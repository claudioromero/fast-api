[project]
name = "fast-api"
version = "0.1.0"
description = "Fast API example"
readme = "README.md"
authors = [
    { name = "claudioromero", email = "riseofthemachines.xxi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.13.0",
]

[project.scripts]
fast-api = "fast_api:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "A", "DTZ", "T20"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
